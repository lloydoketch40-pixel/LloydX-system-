
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lloyd AI Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    .app {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    h1 { color: #60a5fa; }
    #chat {
      height: 55vh;
      min-height: 250px;
      overflow-y: auto;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }
    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #1d4ed8; }
    .bot { background: #334155; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 8px;
      border: 0;
    }
    button {
      padding: 12px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🤖 Lloyd AI</h1>
    <p>Your personal AI assistant</p>

    <div id="chat" aria-live="polite">
      <div class="message bot">
        Hello! Welcome to Lloyd AI. How can I help you?
      </div>
    </div>

    <form id="form">
      <input id="message" placeholder="Ask me anything..."
             autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, sender) {
      const item = document.createElement("div");
      item.className = "message " + sender;
      item.textContent = text;
      chat.appendChild(item);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "Thinking...";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        addMessage(data.reply || "No response received.", "bot");
      } catch (error) {
        addMessage("Could not connect. Check that the app is running.", "bot");
      } finally {
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    });
  </script>
</body>
</html>
